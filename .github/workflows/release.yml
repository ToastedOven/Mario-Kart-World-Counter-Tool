name: "Export & Release Game"

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  export:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Export Godot Project
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://downloads.godotengine.org/?version=4.7.1&flavor=stable&slug=mono_linux_x86_64.zip&platform=linux.64
          godot_export_templates_download_url: https://downloads.godotengine.org/?version=4.7.1&flavor=stable&slug=mono_export_templates.tpz&platform=templates
          relative_project_path: ./
          archive_output: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "Release ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            Builds/*
            Builds/**/*
            build/*
            build/**/*
            *.Zip
            *.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
