name: "Export & Release Game"

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  export:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup Godot Engine
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: true

      - name: Download Export Templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.7.1.stable.mono
          curl -fsSL https://downloads.godotengine.org/4.7.1/Godot_v4.7.1-stable_mono_export_templates.tpz -o templates.zip
          unzip -q templates.zip -d /tmp/templates
          mv /tmp/templates/templates/* ~/.local/share/godot/export_templates/4.7.1.stable.mono/
          rm -rf /tmp/templates templates.zip

      - name: Build C# Solution
        run: dotnet build --configuration ExportRelease

      - name: Export Builds
        run: |
          mkdir -p builds/Linux builds/Windows
          godot --headless --export-release "Linux" builds/Linux/CounterTool_Linux.x86_64
          godot --headless --export-release "Windows" builds/Windows/CounterTool_Windows.exe

      - name: Create Zip Archives
        run: |
          cd builds/Linux && zip -r ../../Linux.zip . && cd ../..
          cd builds/Windows && zip -r ../../Windows.zip . && cd ../..
          zip -r Linux.zip BaseImages Templates IconsForVotes tessdata
          zip -r Windows.zip BaseImages Templates IconsForVotes tessdata

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "Release ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            Linux.zip
            Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
